[pytest]
DJANGO_SETTINGS_MODULE = kasms.test_settings

python_files = test_*.py *_tests.py tests.py
python_classes = Test*
python_functions = test_*

testpaths = tests audit/tests

addopts =
    --strict-markers
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov

markers =
    security: Security and authorization tests
    tenant: Multi-tenant isolation tests
    slow: Tests that are slow (deselect with -m "not slow")
    n_plus_one: N+1 query detection tests

x-log-rotation: &log-rotation
  driver: "json-file"
  options:
    max-size: "10m" # rotate at 10 MB
    max-file: "5" # keep 5 rotated files → max 50 MB per service

x-django-base: &django-base
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  env_file:
    - .env
  restart: unless-stopped
  logging: *log-rotation
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *log-rotation
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend_net
      - frontend_net

  # ──────────────────────────────────────────────────────────────────────────
  # Redis  (Celery broker on DB 0, Django cache on DB 1)
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *log-rotation
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend_net

  # ──────────────────────────────────────────────────────────────────────────
  # Django (Gunicorn)
  # Runs: migrate → collectstatic → gunicorn (see scripts/entrypoint.sh)
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    <<: *django-base
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - app_logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend_net
      - frontend_net
      - monitoring_net
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          python -c "
          import urllib.request, sys
          try:
              r = urllib.request.urlopen('http://localhost:8000/health/', timeout=5)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
          "
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s # migrate + collectstatic can take up to 90s on first run

  celery_worker:
    <<: *django-base
    command: >
      celery -A kasms worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=500
    volumes:
      - media_files:/app/media
      - app_logs:/app/logs
    networks:
      - backend_net
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          python -c "
          import redis, os, sys
          try:
              url = os.environ.get('CELERY_BROKER_URL', 'redis://redis:6379/0')
              r = redis.Redis.from_url(url, socket_connect_timeout=3)
              r.ping()
              sys.exit(0)
          except Exception:
              sys.exit(1)
          "
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *django-base
    # --pidfile lets the healthcheck verify the beat process is alive.
    command: >
      celery -A kasms beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --pidfile=/tmp/celerybeat.pid
    volumes:
      - app_logs:/app/logs
    networks:
      - backend_net
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          test -f /tmp/celerybeat.pid &&
          kill -0 "$(cat /tmp/celerybeat.pid)" 2>/dev/null ||
          exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME:-KASMS}
    restart: unless-stopped
    logging: *log-rotation
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      # proxy (default): behind an edge proxy like Caddy that terminates TLS.
      # standalone: this nginx terminates TLS itself (e.g. a test box with a
      # self-signed cert, reached directly). See nginx/templates/*.template.
      NGINX_TLS_MODE: ${NGINX_TLS_MODE:-proxy}
      # Only used in proxy mode — the edge proxy's IP, so X-Forwarded-* can
      # be trusted from it specifically. See nginx/templates/00-trust.conf.template.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-127.0.0.1}
      # CIDR allowed to reach /admin/ directly. Defaults to loopback-only
      # (i.e. blocked) until explicitly set per environment in .env.
      ADMIN_ALLOWED_CIDR: ${ADMIN_ALLOWED_CIDR:-127.0.0.1/32}
    volumes:
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      # Only read in standalone mode (ssl_certificate/ssl_certificate_key).
      # Harmless, unused mount in proxy mode.
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net
      - monitoring_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost/nginx-health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────────────
  # Monitoring exporters
  # Sidecar services: connect to db/redis via backend_net and expose metrics
  # to Prometheus via the shared monitoring_net external network.
  # Requires:  docker network create monitoring_net  (run once on server)
  # ──────────────────────────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    logging: *log-rotation
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
    networks:
      backend_net:
      monitoring_net:
        aliases:
          - postgres-exporter
    depends_on:
      db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    logging: *log-rotation
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks:
      backend_net:
      monitoring_net:
        aliases:
          - redis-exporter
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge
  monitoring_net:
    external: true
